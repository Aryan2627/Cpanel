name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Build
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1
        # ESLINT_NO_FATAL is needed to avoid build failures on warnings in nextjs, but we'll use a direct build flag instead if needed.
