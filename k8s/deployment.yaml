apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-portal
  labels:
    app: procurement-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: procurement-portal
  template:
    metadata:
      labels:
        app: procurement-portal
    spec:
      containers:
        - name: nextjs-app
          image: your-docker-registry/procurement-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            # Define your secrets here (e.g. database URL)
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: procurement-db-secret
            #       key: url
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
